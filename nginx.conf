worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 25M;
  sendfile on;

  server {
    listen 80;
    server_name _;

    # LTI 1.3 (routers/lti.py). Va sin /api/ a propósito: son URLs que el LMS
    # guarda al registrarse y tienen que quedar estables.
    #
    # `location /lti/` NO se declara acá — la genera start.sh en runtime,
    # dentro del include de abajo, tanto con LTI_ENABLED prendido como
    # apagado. Motivo: nginx rechaza como error fatal de config ("duplicate
    # location") dos bloques `location /lti/` con el mismo path, sin importar
    # que uno lleve el modificador `^~` — no es una cuestión de precedencia en
    # runtime que se pueda resolver por especificidad u orden, nginx ni
    # siquiera arranca. La única forma de garantizar que gana exactamente uno,
    # de forma determinística, es que exista un solo lugar que lo declare.
    # Con LTI apagado, ese bloque generado es una copia fiel del que había
    # antes acá (mismo proxy_pass, sin tocar headers). Con LTI prendido, además
    # saca X-Frame-Options y agrega frame-ancestors * (ver start.sh) — si no,
    # cualquier error de /lti/launch (state inválido, deep linking sin return
    # URL, etc.) se renderiza con DENY dentro del iframe de Moodle: se ve un
    # iframe en blanco en vez del mensaje de error.
    #
    # /lti-select y /s/: locations más específicas que ganan sobre
    # `location /` de más abajo (exact match y prefijo con ^~), generadas
    # sólo con LTI prendido.
    #
    # El nombre del archivo va con glob (no literal) porque un include con
    # nombre literal que no matchea ningún archivo es un error fatal de
    # config; con glob, si la escritura en /etc/nginx/conf.d falla (fs de
    # sólo lectura, USER no-root, mount raro), nginx arranca igual — sin la
    # relajación de framing para LTI en vez de crash-loopear el contenedor.
    include /etc/nginx/conf.d/lti-frame*.conf;

    # Next.js frontend (standalone server on :3000)
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Preserve host:port so Next.js redirects/absolute URLs keep the port.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # FastAPI backend (:8000) — covers /api/v1/survey/* and /api/health
    location /api/ {
      client_max_body_size 60M;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # Uploaded files, streamed by FastAPI (routers/files.py) from disk or the
    # private bucket. Cache-Control comes from the app (public for design
    # assets, private for respondent files) — don't override it here. Buffering
    # off so video playback/seek starts immediately.
    location /assets/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_buffering off;
    }

    # API docs (optional, handy)
    location /docs {
      proxy_pass http://127.0.0.1:8000/docs;
      proxy_set_header Host $host;
    }
    location /openapi.json {
      proxy_pass http://127.0.0.1:8000/openapi.json;
      proxy_set_header Host $host;
    }
  }
}
