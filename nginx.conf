worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  client_max_body_size 25M;
  sendfile on;

  server {
    listen 80;
    server_name _;

    # LTI 1.3 (routers/lti.py). Va sin /api/ a propósito: son URLs que el LMS
    # guarda al registrarse y tienen que quedar estables.
    #
    # Bloque estático (no generado por start.sh) y con la relajación de
    # framing incondicional — no atada a LTI_ENABLED. Antes esto vivía en un
    # snippet generado en runtime junto con /lti-select y /s/, para evitar el
    # error fatal de nginx ("duplicate location") de tener este mismo bloque
    # acá Y en el include. Eso resolvía la duplicación pero dejaba el ruteo de
    # /lti/ (toda la integración LTI, no sólo el framing) dependiendo de que
    # la escritura del snippet en /etc/nginx/conf.d tuviera éxito: con fs de
    # sólo lectura, un USER no-root o un mount raro, el include no matchea nada
    # (ver el glob más abajo) y /lti/* cae en silencio en el catch-all de
    # Next.js en vez de llegar a FastAPI — peor que el crash-loop que se
    # evitaba, porque es silencioso.
    #
    # Por qué la relajación acá no necesita el flag: con LTI apagado, el
    # `require_lti` de routers/lti.py hace que TODA la superficie de /lti/
    # devuelva 404 — no hay UI ni acción que clickjackear en un 404, así que
    # da lo mismo si esa respuesta es enmarcable o no. Y con LTI prendido,
    # dejar pasar la CSP siempre evita que un error de /lti/launch (state
    # inválido o vencido, deep linking sin return URL) se renderice con DENY
    # dentro del iframe de Moodle: en vez de eso se ve el mensaje de error.
    # O sea: condicionar esto al flag no compra nada (el 404 no tiene nada que
    # proteger) y cuesta la garantía de que /lti/ siempre llega a FastAPI.
    location /lti/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Frame-Options;
      add_header Content-Security-Policy "frame-ancestors *" always;
      # El registro dinámico (GET /lti/register) hace dos llamadas salientes
      # de hasta 15s cada una (leer openid_configuration, postear el
      # registro) más DNS -- sin esto, el timeout de lectura de 60s por
      # default de nginx puede disparar a mitad del asistente de Moodle.
      # Mismos valores que el resto de las locations de este archivo.
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # mod_encuestum (routers/modapi.py), la actividad nativa de Moodle. Va sin
    # /api/ por el mismo motivo que /lti/: son URLs que el plugin guarda en sus
    # ajustes y tienen que quedar estables.
    #
    # Estático y no atado a MOD_ENABLED, igual que /lti/ y por el mismo
    # razonamiento: con el módulo apagado, `require_mod` hace que TODA la
    # superficie devuelva 404, así que la bandera no compra nada acá; y
    # generarlo en runtime dejaría el ruteo de /mod/ dependiendo de que la
    # escritura en /etc/nginx/conf.d tuviera éxito -- si falla, /mod/* cae en
    # silencio en el catch-all de Next.js en vez de llegar a FastAPI.
    #
    # A diferencia de /lti/, acá NO se relaja el framing: el único endpoint que
    # hay hoy es `POST /mod/register`, servidor a servidor, que nunca vive en un
    # iframe. `GET /mod/launch` (Tarea 2) sí se embebe: cuando exista hay que
    # agregarle `proxy_hide_header X-Frame-Options` y la CSP `frame-ancestors`,
    # como acá arriba.
    location /mod/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # /lti-select y /s/: acá sí importa el flag, porque son páginas
    # renderizadas de verdad (UI real, acciones reales) y no una superficie
    # que colapsa a 404 con LTI apagado. Generadas por start.sh en runtime,
    # locations más específicas que ganan sobre `location /` de más abajo
    # (exact match y prefijo con ^~).
    #
    # El nombre del archivo va con glob (no literal) porque un include con
    # nombre literal que no matchea ningún archivo es un error fatal de
    # config; con glob, si la escritura en /etc/nginx/conf.d falla (fs de
    # sólo lectura, USER no-root, mount raro), nginx arranca igual — sin la
    # relajación de framing para estas dos rutas en vez de crash-loopear el
    # contenedor. (Este mismo riesgo ya no aplica a /lti/, que quedó estático
    # arriba.)
    include /etc/nginx/conf.d/lti-frame*.conf;

    # Next.js frontend (standalone server on :3000)
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      # Preserve host:port so Next.js redirects/absolute URLs keep the port.
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # FastAPI backend (:8000) — covers /api/v1/survey/* and /api/health
    location /api/ {
      client_max_body_size 60M;
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 5m;
      proxy_connect_timeout 5m;
    }

    # Uploaded files, streamed by FastAPI (routers/files.py) from disk or the
    # private bucket. Cache-Control comes from the app (public for design
    # assets, private for respondent files) — don't override it here. Buffering
    # off so video playback/seek starts immediately.
    location /assets/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_buffering off;
    }

    # API docs (optional, handy)
    location /docs {
      proxy_pass http://127.0.0.1:8000/docs;
      proxy_set_header Host $host;
    }
    location /openapi.json {
      proxy_pass http://127.0.0.1:8000/openapi.json;
      proxy_set_header Host $host;
    }
  }
}
